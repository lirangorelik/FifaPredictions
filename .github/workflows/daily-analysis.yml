name: Daily Analysis

on:
  schedule:
    # GitHub's cron scheduler is unreliable and DELAYS/SKIPS jobs scheduled on the hour (:00) the
    # most, because that is its highest-load minute. So we (a) run at an off-peak minute (:26) and
    # (b) fire FIVE times across the afternoon as fallbacks. The first run of the day to succeed
    # sends the Telegram message; BATCH_DEDUPE_HOURS=20 + the imminent-kickoff guard make every
    # later run that day a no-op, so this never double-sends.
    #
    # Times (UTC ≈ Israel = UTC+3 in summer):
    #   11:26 (14:26 IL) and 12:26 (15:26 IL) → early buffer, safe before ~17:00 UTC kickoffs
    #   14:26 (17:26 IL) → original intended slot
    #   16:26, 18:26 → late safety nets for evening-only match days
    - cron: "26 11 * * *"
    - cron: "26 12 * * *"
    - cron: "26 14 * * *"
    - cron: "26 16 * * *"
    - cron: "26 18 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run run:analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
